<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | Arkians Collectibles</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Dots&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>


  <!-- HEADER -->

  <header class="site-header">

    <div class="header-inner">

      <a href="index.html" class="logo">
        Arkians Collectibles
      </a>


      <nav class="main-nav">

        <div class="nav-item dropdown">

          <a href="coins.html" class="nav-link">
            Products
            <span class="arrow">⌄</span>
          </a>

          <div class="dropdown-menu">
            <a href="coins.html">Coins</a>
            <a href="cards.html">Cards</a>
          </div>

        </div>


  


        <div class="nav-item">
          <a href="about.html" class="nav-link">
            About Us
          </a>
        </div>

      </nav>



      <!-- SEARCH -->

      <div class="search-wrapper">

        <form class="search-bar" id="searchForm">

          <input
            type="text"
            id="searchInput"
            placeholder="Search Coins..."
            autocomplete="off"
          >

          <button type="submit" aria-label="Search">

            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20L16.5 16.5"></path>
            </svg>

          </button>

        </form>

        <div
          class="search-results"
          id="searchResults"
        ></div>

      </div>



      <!-- ICONS -->

      <div class="header-icons">

        <a
          href="account.html"
          class="icon-button"
          aria-label="Account"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
          </svg>
        </a>


        <a
          href="wishlist.html"
          class="icon-button"
          aria-label="Wishlist"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              d="M20.8 4.6c-2-2-5.3-2-7.3 0L12 6.1l-1.5-1.5c-2-2-5.3-2-7.3 0s-2 5.3 0 7.3L12 20.7l8.8-8.8c2-2 2-5.3 0-7.3z"
            ></path>
          </svg>
        </a>


        <a
          href="cart.html"
          class="icon-button"
          aria-label="Cart"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 8h12l-1 13H7L6 8z"></path>
            <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
          </svg>
        </a>

      </div>

    </div>

  </header>



  <!-- PRODUCT -->

  <main class="product-page">

    <section class="product-detail">


      <!-- LEFT IMAGE -->

      <div class="product-image-area">

        <img
          id="productImage"
          class="product-detail-image"
          src=""
          alt=""
        >

      </div>



      <!-- RIGHT INFORMATION -->

      <div class="product-info">

        <div
          id="productMeta"
          class="product-detail-meta"
        ></div>


        <h1 id="productName">
          Coin Name
        </h1>


        <div
          id="productPrice"
          class="product-detail-price"
        >
          €0.00
        </div>


        <p
          id="productDescription"
          class="product-description"
        >
          Product description.
        </p>



        <div class="product-actions">

          <button
            id="productAddToCart"
            class="add-cart-button"
            type="button"
          >
            Add to Cart
          </button>


          <button
            id="productWishlistButton"
            class="product-wishlist-button"
            type="button"
          >

            <svg viewBox="0 0 24 24">
              <path
                d="M20.8 4.6c-2-2-5.3-2-7.3 0L12 6.1l-1.5-1.5c-2-2-5.3-2-7.3 0s-2 5.3 0 7.3L12 20.7l8.8-8.8c2-2 2-5.3 0-7.3z"
              ></path>
            </svg>

            Add to Wishlist

          </button>

        </div>

      </div>

    </section>



    <!-- RELATED PRODUCTS -->

    <section class="related-products">

      <h2>
        You may also like
      </h2>

      <div
        id="relatedProducts"
        class="coin-grid"
      ></div>

    </section>

  </main>



  <!-- FOOTER -->

  <footer class="site-footer">

    <div class="footer-inner">

      <div class="footer-brand">

        <div class="logo">
          Arkians Collectibles
        </div>

      </div>


      <div class="footer-column">

        <h3>About Us</h3>

        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>

      </div>


      <div class="footer-column">

        <h3>Shop By</h3>

        <a href="coins.html">Country</a>
        <a href="coins.html">Year</a>
      

      </div>


      <div class="footer-column">

        <h3>My Account</h3>

        <a href="profile.html">Profile</a>
        <a href="cart.html">Cart</a>
        <a href="wishlist.html">Wishlist</a>

      </div>

    </div>

  </footer>



  <!-- SCRIPTS -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>

</body>

</html>
