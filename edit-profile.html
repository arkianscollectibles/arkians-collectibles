  <!-- EDIT PROFILE -->

  <main class="edit-profile-page">

    <section class="page-intro">

      <h1>Edit Profile</h1>

      <p>
        Update your personal information
      </p>

    </section>


    <section class="edit-profile-box">

      <h2>Personal Information</h2>

      <form id="editProfileForm">

        <div class="profile-form-group">

          <label for="editName">
            Name
          </label>

          <input
            type="text"
            id="editName"
            placeholder="Your name"
          >

        </div>


        <div class="profile-form-group">

          <label for="editEmail">
            E-mail
          </label>

          <input
            type="email"
            id="editEmail"
            readonly
          >

        </div>


        <div class="profile-form-group">

          <label for="editAddress">
            Address
          </label>

          <input
            type="text"
            id="editAddress"
            placeholder="Your address"
          >

        </div>


        <div class="profile-form-group">

          <label for="editPhone">
            Phone Number
          </label>

          <input
            type="tel"
            id="editPhone"
            placeholder="Your phone number"
          >

        </div>


        <button
          type="submit"
          class="save-profile-button"
        >
          Save
        </button>

      </form>

    </section>

  </main>
